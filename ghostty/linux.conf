# ~/.config/ghostty/os.conf on Linux -- symlinked from ~/dotfiles/ghostty/linux.conf,
# read at the end of ghostty/config. macOS has no os.conf, so none of this applies there.

# i3 already frames every window; Ghostty's GTK title bar (tab button, minimize/maximize/close)
# would be a second frame inside it
gtk-titlebar = false

# Linux renders font points at 96 DPI where macOS uses 72, so the Mac's 14 is about 11 here
font-size = 11
