# ~/.tmux.conf -- symlinked from ~/dotfiles/tmux/.tmux.conf
# No plugin manager on purpose: everything here is built-in tmux 3.4+.
# Prefix stays ctrl+b. ctrl+a would clash with Ghostty's cmd+left (it sends ctrl+a),
# and ctrl+space is macOS's input-source switcher.
# Reload: prefix r

# --- terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:usstyle:sync"
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g set-clipboard on
# lets Claude Code / image tools talk to Ghostty through tmux
set -g allow-passthrough on
set -g history-limit 100000
set -g mouse on

# --- sane defaults ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# killing a session drops you into the next one instead of out of tmux
set -g detach-on-destroy off
set -g display-time 1500
setw -g aggressive-resize on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S · #W"
# name windows after the running program, or the folder when it's just a shell
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
setw -g monitor-bell on
set -g bell-action other

# --- keys ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# splits and new windows open in the current folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane moves and resizes (hold prefix, tap repeatedly)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind Tab last-window
bind BTab switch-client -l
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind x kill-pane
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# vertical list of every session/window with live preview, like a pop-up sidebar
bind w choose-tree -Zw
bind s choose-tree -Zs

# popups
bind f display-popup -E -w 70% -h 70% -b rounded -T " sessions " "tmux-sessionizer"
bind g display-popup -E -w 92% -h 92% -b rounded -d "#{pane_current_path}" lazygit
bind C display-popup -E -w 92% -h 92% -b rounded -d "#{pane_current_path}" claude
bind t display-popup -E -w 80% -h 75% -b rounded -d "#{pane_current_path}"

# copy mode: prefix v, then v select, ctrl+v block, y copy
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- look: Catppuccin Mocha, matches Ghostty ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 40
# session pill turns red while prefix is held
set -g status-left "#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#cba6f7},bold]  #S #[bg=default] "
set -g status-right-length 90
set -g status-right "#{?window_zoomed_flag,#[fg=#f9e2af]󰁌 zoom  ,}#[fg=#89b4fa] #{b:pane_current_path}  #[fg=#a6e3a1]#(b=$(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) && [ -n \"$b\" ] && echo \" $b\") "
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I #W#{?window_bell_flag, #[fg=#f38ba8]●,} "
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g popup-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"
