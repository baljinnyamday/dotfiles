; Top bar, hidden after login: $mod+Shift+/ shows or hides it (linux/i3/scripts/bar-toggle).
; It floats over the windows instead of pushing them down, so toggling it moves nothing.
; Colors are the i3 theme's (linux/i3/config).

[colors]
background = #08052b
border = #383c4a
foreground = #e6e6f0
dim = #8b8b8b
accent = #5294e2
alert = #e53935

[bar/main]
width = 100%:-24
height = 32
offset-x = 12
offset-y = 8
; No rounded corners: without a compositor the cut-off corners draw black.
override-redirect = true
enable-ipc = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1
border-color = ${colors.border}
padding = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;3
modules-left = i3 media
modules-center = date
modules-right = updates xkeyboard bluetooth wifi volume cpu temperature gpu memory disk notifications tray
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
; i3 binding modes such as resize
label-mode = %mode%
label-mode-background = ${colors.alert}
label-mode-padding = 1

; Click to play or pause, right-click for the next track.
[module/media]
type = custom/script
exec = ~/.config/polybar/media
tail = true
label = %output%
label-maxlen = 50
click-left = playerctl play-pause
click-right = playerctl next

[module/date]
type = internal/date
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
label-layout = 󰌌 %layout%

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/bluetooth
interval = 5
label = %output%
label-maxlen = 24
click-left = overskride &

; Click for Wi-Fi settings (NetworkManager's nmtui, floated by linux/i3/config).
[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
format-connected = %{A1:~/.config/polybar/wifi-settings:}<ramp-signal> <label-connected>%{A}
format-disconnected = %{A1:~/.config/polybar/wifi-settings:}<label-disconnected>%{A}
label-connected = %essid%
label-disconnected = 󰤮 offline
label-disconnected-foreground = ${colors.dim}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

; Scroll to change the volume, click to mute, right-click for the mixer.
[module/volume]
type = internal/pulseaudio
; Scrolling stops at 100% like the volume keys. Past 100% is digital boost on top of the
; headphones' own maximum, which distorts loud music.
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2
label = 󰻠 %percentage%%

[module/memory]
type = internal/memory
interval = 5
label = 󰍛 %percentage_used%%

[module/disk]
type = internal/fs
mount-0 = /
interval = 60
warn-percentage = 90
label-mounted = 󰋊 %percentage_used%%
label-warn = 󰋊 %percentage_used%%
label-warn-foreground = ${colors.alert}

[module/gpu]
type = custom/script
exec = ~/.config/polybar/gpu
interval = 3

; Pending package updates; hidden when there are none.
[module/updates]
type = custom/script
exec = ~/.config/polybar/updates
interval = 1800

; Do not disturb: click to pause or resume notifications.
[module/notifications]
type = custom/script
exec = [ "$(dunstctl is-paused)" = true ] && echo 󰂛 || echo 󰂚
interval = 2
click-left = dunstctl set-paused toggle

[module/temperature]
type = internal/temperature
zone-type = x86_pkg_temp
warn-temperature = 80
label = 󰔏 %temperature-c%
label-warn = 󰔏 %temperature-c%
label-warn-foreground = ${colors.alert}

; LibrePods and other StatusNotifier apps show up here through snixembed.
[module/tray]
type = internal/tray
tray-spacing = 6px
