"$schema" = 'https://starship.rs/config-schema.json'

# Flat Catppuccin Mocha prompt (matches the Ghostty theme). No pills or caps:
# plain coloured text, so the line is cheap to draw and nothing "bubbles".
#
#   󰇥 ~/dotfiles  main !?  v24.20.0 ··········· 󰮯 ····· 󰊠 10:30
#   ❯
#
# The pacman/ghost trail is just $fill between two icons.
# Unused language modules are left out on purpose: each one that exists gets
# a chance to spawn `<tool> --version`, and that is what makes prompts lag.

format = """
${env_var.PROMPT_ICON}\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
[\U000F0BAF](fg:yellow)\
$fill\
[\U000F02A0](fg:pink) \
$time\
$line_break$character"""

# Give up on any module that takes longer than this rather than stall the prompt.
command_timeout = 300

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
overlay0 = '#6c7086'
surface0 = '#313244'
crust = '#11111b'

# Lead icon is a duck (poop after a failed command): ~/.zshrc exports
# PROMPT_ICON before each prompt. Falls back to the Apple logo in shells that don't set it.
[env_var.PROMPT_ICON]
default = ""
style = "fg:mauve"
format = '[$env_value]($style) '

# Only shown over SSH or as root; on your own machine it is just noise.
[username]
show_always = false
style_user = "fg:mauve"
style_root = "bold fg:red"
format = '[$user]($style) '

[directory]
style = "bold fg:blue"
read_only_style = "fg:red"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 0        # full path, never "…/"
truncate_to_repo = false     # don't cut the path off at the git root either

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:green"
format = "[$symbol $branch]($style) "

[git_status]
style = "fg:yellow"
format = "([$all_status$ahead_behind]($style) )"
ignore_submodules = true   # never walk into submodules for the status glyphs

[nodejs]
symbol = ""
style = "fg:peach"
format = "[$symbol( $version)]($style) "

[bun]
symbol = ""
style = "fg:peach"
format = "[$symbol( $version)]($style) "

[python]
symbol = ""
style = "fg:peach"
format = "[$symbol( $version)]($style) "
python_binary = ["python3"]   # `python` is only an alias here; skip the failed spawn

[rust]
symbol = ""
style = "fg:peach"
format = "[$symbol( $version)]($style) "

[golang]
symbol = ""
style = "fg:peach"
format = "[$symbol( $version)]($style) "

[docker_context]
symbol = ""
style = "fg:teal"
format = "[$symbol( $context)]($style) "

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[ $duration]($style) "

[fill]
symbol = "·"
style = "fg:overlay0"

[time]
disabled = false
time_format = "%R"
style = "fg:overlay0"
format = "[$time]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[\(╯°□°\)╯︵ ┻━┻ ❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:mauve)'
vimcmd_replace_symbol = '[❮](bold fg:mauve)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'
