# /etc/keyd/default.conf -- copied from ~/mac-dotfiles/linux/keyd.conf (opt-in, see README)
# keyd remaps keys in the kernel, below X11/Wayland, so it works in every app and the TTY too.
# Caps Lock: tap for Esc, hold for Ctrl (vim, tmux, shell shortcuts without leaving home row).
[ids]
*

[main]
capslock = overload(control, esc)
