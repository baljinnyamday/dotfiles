# /etc/X11/xorg.conf.d/10-keyrepeat.conf -- copied from ~/mac-dotfiles/linux/xorg-keyrepeat.conf by install.sh
# Key repeat matching the Mac (macos.sh: InitialKeyRepeat 12, KeyRepeat 1, read as 1/60 s ticks):
# 200 ms before the first repeat, then 60 a second (X keeps whole ms, so one every 16 ms).
# Here rather than `xset r rate`: X applies it to every keyboard it adds, so a replugged keyboard
# or a resume from suspend keeps it instead of falling back to X's 660 ms / 25 a second.
Section "InputClass"
        Identifier "keyrepeat"
        MatchIsKeyboard "on"
        Option "AutoRepeat" "200 60"
EndSection
